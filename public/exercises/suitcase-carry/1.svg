  <line x1="40" y1="362" x2="560" y2="362" stroke="#2a2f3f" stroke-width="4"/>
  <g fill="none" stroke="#e8ebf3" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="300,192 284,270 258,348" stroke-width="18"/>
    <line x1="250" y1="354" x2="292" y2="354" stroke-width="14"/>
    <polyline points="300,192 322,270 334,348" stroke-width="18"/>
    <line x1="326" y1="354" x2="370" y2="354" stroke-width="14"/>
